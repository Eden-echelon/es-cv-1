<div class="container">

            <p style="font-size:12px;">Replace `ws://your-flyio-app.internal` with real signaling server.<br></p>

<script>

    let mediaStream = null;
    let mediaRecorder = null;
    let currentChunks = [];    
    let chunkStartTime = null;
    let chunkInterval = 5 * 60 * 1000;
    let chunkCounter = 0;

    const DB_NAME = 'Protocol7DB';
    const STORE_NAME = 'audioChunks';
    let db = null;

    const chunkCounterSpan = document.getElementById('chunkCounter');
    const pttStateSpan = document.getElementById('pttState');
    const pttButton = document.getElementById('pttButton');
    const refreshBtn = document.getElementById('refreshChunksBtn');
    const clearAllBtn = document.getElementById('clearAllChunksBtn');
    const chunksListEl = document.getElementById('chunksList');
    const peerStatusSpan = document.getElementById('peerStatus');

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open('Protocol7DB', 2);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                db = request.result;
                resolve(db);
            };
            request.onupgradeneeded = (event) => {
                const dbRef = event.target.result;
                if (!dbRef.objectStoreNames.contains('audioChunks')) {
                    dbRef.createObjectStore('audioChunks', { keyPath: 'id' });
                }
            };
        });
    }

    async function saveChunkToDB(blob, durationSec, startTimestamp) {
        if (!db) await openDB();
        const id = `chunk_${startTimestamp}_${Date.now()}`;
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        store.put({ id, blob, durationSec, timestamp: startTimestamp, date: new Date(startTimestamp).toISOString() });
        return new Promise((resolve) => { transaction.oncomplete = resolve; });
    }

    async function getAllChunks() {
        if (!db) await openDB();
        return new Promise((resolve) => {
            const tx = db.transaction([STORE_NAME], 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result.sort((a,b) => a.timestamp - b.timestamp));
        });
    }

    async function deleteAllChunks() {
        if (!db) await openDB();
        const tx = db.transaction([STORE_NAME], 'readwrite');
        tx.objectStore(STORE_NAME).clear();
        return new Promise((resolve) => { tx.oncomplete = resolve; });
    }

    async function deleteChunkById(id) {
        if (!db) await openDB();
        const tx = db.transaction([STORE_NAME], 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        return new Promise((resolve) => { tx.oncomplete = resolve; });
    }

    async function startPerpetualRecording() {
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            startNewRecorderChunk();
        } catch (err) {
            console.error("microphone access denied:", err);
            alert("need microphone for pr.");
        }
    }

function startNewRecorderChunk() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        
        return;
    }
    
    currentChunks = [];
    chunkStartTime = Date.now();

    const mimeType = MediaRecorder.isTypeSupported('audio/webm') 
        ? 'audio/webm' 
        : MediaRecorder.isTypeSupported('audio/mp4') 
            ? 'audio/mp4' 
            : '';
    
    mediaRecorder = new MediaRecorder(mediaStream, { mimeType });
    
    mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
            currentChunks.push(event.data);
        }
    };
    mediaRecorder.onstop = async () => {
        if (currentChunks.length === 0) return;
        
        const fullBlob = new Blob(currentChunks, { type: 'audio/webm' });
        const duration = (Date.now() - chunkStartTime) / 1000;
        await saveChunkToDB(fullBlob, duration, chunkStartTime);
        chunkCounter++;
        chunkCounterSpan.innerText = chunkCounter;
        renderChunksList();
        
        startNewRecorderChunk();
    };
    
    mediaRecorder.start(1000);

    setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop(); // This triggers onstop above
        }
    }, chunkInterval);
}

    async function renderChunksList() {
        const chunks = await getAllChunks();
        if (!chunks.length) {
            chunksListEl.innerHTML = '<li style="justify-content:center;">📼 no recorded chunks yet</li>';
            return;
        }
        chunksListEl.innerHTML = '';
        for (const chunk of chunks) {
            const li = document.createElement('li');
            const audioUrl = URL.createObjectURL(chunk.blob);
            const audioEl = document.createElement('audio');
            audioEl.controls = true;
            audioEl.src = audioUrl;
            const infoSpan = document.createElement('span');
            infoSpan.style.fontSize = '0.75rem';
            infoSpan.innerText = `${new Date(chunk.timestamp).toLocaleTimeString()} (${Math.round(chunk.durationSec)}s)`;
            const delBtn = document.createElement('button');
            delBtn.innerText = 'delete';
            delBtn.classList.add('danger');
            delBtn.onclick = async () => {
                await deleteChunkById(chunk.id);
                URL.revokeObjectURL(audioUrl);
                renderChunksList();
            };
            const downloadBtn = document.createElement('button');
            downloadBtn.innerText = '⬇️';
            downloadBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = audioUrl;
                a.download = `protocol7_${chunk.id}.webm`;
                a.click();
            };
            li.appendChild(audioEl);
            li.appendChild(infoSpan);
            li.appendChild(downloadBtn);
            li.appendChild(delBtn);
            chunksListEl.appendChild(li);
        }
    }

    let peerConnection = null;
    let remoteAudioElement = null;
    let pttActive = false;
    let pttStreamSender = null;

    async function initWebRTC() {

        remoteAudioElement = new Audio();
        remoteAudioElement.autoplay = true;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        peerConnection = new RTCPeerConnection(config);

        peerConnection.ontrack = (event) => {
            remoteAudioElement.srcObject = event.streams[0];
        };

        peerStatusSpan.innerText = 'mock (no signaling)';
    }

    async function startPTTStream() {
        if (!peerConnection) await initWebRTC();
        if (!mediaStream) {
            alert("Wait for mic permission from perpetual recorder.");
            return;
        }

        const senders = peerConnection.getSenders();
        const hasAudio = senders.some(s => s.track?.kind === 'audio');
        if (!hasAudio && mediaStream) {
            const audioTrack = mediaStream.getAudioTracks()[0];
            if (audioTrack) {
                pttStreamSender = peerConnection.addTrack(audioTrack, mediaStream);
            }
        }
        pttActive = true;
        pttStateSpan.innerText = '🔴 LIVE TRANSMIT';
    }

    function stopPTTStream() {
        if (pttStreamSender && peerConnection) {
            peerConnection.removeTrack(pttStreamSender);
            pttStreamSender = null;
        }
        pttActive = false;
        pttStateSpan.innerText = 'OFF AIR';
    }

    pttButton.addEventListener('mousedown', startPTTStream);
    pttButton.addEventListener('mouseup', stopPTTStream);
    pttButton.addEventListener('mouseleave', stopPTTStream);
    pttButton.addEventListener('touchstart', startPTTStream);
    pttButton.addEventListener('touchend', stopPTTStream);

    refreshBtn.onclick = renderChunksList;
    clearAllBtn.onclick = async () => {
        if (confirm('Delete ALL recorded chunks?')) {
            await deleteAllChunks();
            renderChunksList();
        }
    };

    document.getElementById('connectWebRTC').onclick = () => {
        peerStatusSpan.innerText = 'signaling required → edit ws endpoint';
        alert('To enable cross-device PTT, implement WebSocket signaling to Fly.io');
        initWebRTC();
    };

    (async () => {
        await openDB();
        await startPerpetualRecording();
        renderChunksList();
        await initWebRTC();
    })();
    
</script>

    ];

        const existing = document.querySelectorAll('.tactical-popup');
        if (existing.length > 3) return;

        });

            location.reload();
        });
    }
    
    function augmentAudioControls() {

        if (!window.renderChunksList) return;
        const originalRender = window.renderChunksList;
        window.renderChunksList = async function() {
            await originalRender();

            document.querySelectorAll('audio').forEach(audio => {
                audio.controls = true;
                audio.preload = 'metadata';

                const parentLi = audio.closest('li');
                if (parentLi && !parentLi.querySelector('.convert-btn')) {
                    const convBtn = document.createElement('button');
                    convBtn.textContent = '🔄 Convert';
                    convBtn.className = 'tool-btn';
                    convBtn.style.fontSize = '10px';
                    convBtn.onclick = async (e) => {
                        e.stopPropagation();
                        const src = audio.src;
                        if (!src) return;
                        const response = await fetch(src);
                        const blob = await response.blob();

                        const wavUrl = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = wavUrl;
                        a.download = `converted_${Date.now()}.wav`;
                        a.click();
                        URL.revokeObjectURL(wavUrl);
                        alert('Convert placeholder: re-encode to WAV (original saved).');
                    };
                    parentLi.appendChild(convBtn);
                }
            });
        };
    }
    
    function addFooter() {
        if (document.querySelector('.gov-footer')) return;
        const footer = document.createElement('div');
        footer.className = 'gov-footer';
        footer.innerHTML = `
            <div>🇿🇦 AIRSPACE SURVEILLANCE</div>
        `;
        document.body.appendChild(footer);
    }
    
    const accessAlgorithms = [
        { name: "CLEARANCE_DELTA", check: () => true },
        { name: "ECHO_ROTATION", check: () => Math.random() > 0.2 },
        { name: "TANGO_OVERRIDE", check: () => new Date().getMinutes() % 2 === 0 }
    ];
    
    function initAccessGate() {
        const gatePass = accessAlgorithms.every(algo => algo.check());
        if (!gatePass) {
            console.warn("Protocol-7 gate: limited mode");
        } else {
            console.log("Protocol-7 gate: FULL TACTICAL ACCESS");
        }
        window.__protocol7Gate = gatePass;
    }
    
    function enhanceRecorderResilience() {
        if (!window.startNewRecorderChunk || !window.mediaStream) return;
        let lastChunkTime = Date.now();
        const checkInterval = setInterval(() => {
            if (document.visibilityState === "visible") {
                if (!window.mediaRecorder || window.mediaRecorder.state === 'inactive') {
                    console.warn("Protocol-7: Recorder inactive, restarting chunk");
                    if (window.startNewRecorderChunk) window.startNewRecorderChunk();
                }
            }
        }, 30000);
        
        window.addEventListener('beforeunload', () => clearInterval(checkInterval));

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && (!window.mediaRecorder || window.mediaRecorder.state === 'inactive')) {
                if (window.startNewRecorderChunk) setTimeout(() => window.startNewRecorderChunk(), 100);
            }
        });
    }
    
    function protocol7Bootstrap() {
        initSkyLayer();
        injectHeader();
        addQuickNav();
        addFooter();
        augmentAudioControls();
        initAccessGate();

        setTimeout(() => {
            enhanceRecorderResilience();
            if (window.renderChunksList) window.renderChunksList();
        }, 2000);
        

        const addLoadFeedback = () => {
            document.querySelectorAll('button').forEach(btn => {
                if (btn.hasAttribute('data-load-enhanced')) return;
                btn.setAttribute('data-load-enhanced', 'true');
                btn.addEventListener('click', function(e) {
                    if (this.disabled) return;
                    const originalText = this.innerHTML;
                    this.innerHTML = `<span class="load-spinner"></span>`;
                    setTimeout(() => { if (this) this.innerHTML = originalText; }, 300);
                });
            });
        };
        setInterval(addLoadFeedback, 1000);
    }
    
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', protocol7Bootstrap);
    else protocol7Bootstrap();
    
})();
            
</script>
    
</body>
    
</html>
