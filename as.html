<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Way Web Radio</title>
    <!-- FIXED: Correct PeerJS library script link -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #222; color: #fff; }
        button { font-size: 18px; padding: 15px 30px; margin: 10px; cursor: pointer; border-radius: 5px; border: none; }
        #ptt-btn { background: #666; color: white; width: 200px; height: 100px; font-weight: bold; }
        #ptt-btn:active { background: #d9534f; }
        .status { margin: 20px; font-weight: bold; color: #5cb85c; }
    </style>
</head>
<body>

    <h1>2-Way PTT Radio</h1>
    
    <div>
        <p>Your Radio ID: <span id="my-id" style="color: #f0ad4e;">Connecting...</span></p>
        <input type="text" id="remote-id" placeholder="Enter Friend's Radio ID" style="padding: 10px; width: 200px;">
        <button onclick="connectToFriend()" style="background: #0275d8; color: white; padding: 10px;">Connect</button>
    </div>

    <div class="status" id="status-text">Status: Offline</div>

    <button id="ptt-btn" disabled>HOLD TO TALK</button>

    <script>
        let peer;
        let myId;
        let currentCall;
        let localStream;

        peer = new Peer();

        peer.on('open', (id) => {
            myId = id;
            document.getElementById('my-id').innerText = id;
            document.getElementById('status-text').innerText = "Status: Ready. Share your ID.";
            setupAudio();
        });

        async function setupAudio() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                // FIXED: Safely loop through tracks so it doesn't crash if index 0 is briefly empty
                localStream.getAudioTracks().forEach(track => track.enabled = false); 
                
                setupPTTButton();
            } catch (err) {
                alert("Microphone access denied or not supported. Use HTTPS or Localhost.");
                console.error(err);
            }
        }

        peer.on('call', (call) => {
            currentCall = call;
            document.getElementById('status-text').innerText = "Status: Connected!";
            document.getElementById('ptt-btn').disabled = false;
            call.answer(localStream);
            
            call.on('stream', (remoteStream) => {
                playRemoteStream(remoteStream);
            });
        });

        function connectToFriend() {
            const friendId = document.getElementById('remote-id').value;
            if (!friendId) return alert("Enter an ID first!");

            document.getElementById('status-text').innerText = "Connecting...";
            currentCall = peer.call(friendId, localStream);

            currentCall.on('stream', (remoteStream) => {
                document.getElementById('status-text').innerText = "Status: Connected!";
                document.getElementById('ptt-btn').disabled = false;
                playRemoteStream(remoteStream);
            });
        }

        function playRemoteStream(stream) {
            let audio = document.getElementById('remote-audio');
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = 'remote-audio';
                audio.autoplay = true;
                document.body.appendChild(audio);
            }
            audio.srcObject = stream;
        }

        function setupPTTButton() {
            const btn = document.getElementById('ptt-btn');
            btn.addEventListener('mousedown', startTransmitting);
            btn.addEventListener('mouseup', stopTransmitting);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); startTransmitting(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); stopTransmitting(); });
        }

        function startTransmitting() {
            if (localStream) {
                localStream.getAudioTracks().forEach(track => track.enabled = true);
                document.getElementById('status-text').innerText = "Status: TRANSMITTING...";
            }
        }

        function stopTransmitting() {
            if (localStream) {
                localStream.getAudioTracks().forEach(track => track.enabled = false);
                document.getElementById('status-text').innerText = "Status: Connected (Listening)";
            }
        }
    </script>
</body>
</html>
