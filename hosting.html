<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DriveHost - Upload to My Google Drive</title>

    <link rel="icon" type="image/png" href="favicon.png" sizes="16x16">

    <link rel="icon" type="image/png" href="favicon.png" sizes="32x32">
    <link rel="icon" type="image/png" href="favicon.png" sizes="48x48">
    <link rel="icon" type="image/png" href="favicon.png" sizes="96x96">
    <link rel="icon" type="image/png" href="favicon.png" sizes="192x192">
    
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="apple-touch-icon-precomposed" href="favicon.png">
    
    <meta name="msapplication-TileImage" content="favicon.png">
    <meta name="msapplication-TileColor" content="#000000">    

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            margin-bottom: 30px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
            transform: scale(1.01);
        }

        .upload-area.drag-over {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-area p {
            color: #667eea;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .upload-area small {
            color: #999;
            font-size: 0.9em;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .file-list {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .file-list h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
            transition: background 0.2s;
        }

        .file-item:hover {
            background: white;
            border-radius: 8px;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-info {
            flex: 1;
        }

        .file-name {
            color: #333;
            font-weight: 500;
            word-break: break-all;
        }

        .file-size {
            color: #666;
            font-size: 0.85em;
            margin-left: 10px;
        }

        .file-date {
            color: #999;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .file-link {
            background: #28a745;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85em;
            transition: background 0.2s;
            margin-left: 10px;
        }

        .file-link:hover {
            background: #218838;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            margin-left: 10px;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
            border-left: 4px solid #28a745;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
            border-left: 4px solid #dc3545;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
            border-left: 4px solid #17a2b8;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f2ff 100%);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.85em;
            color: #666;
        }

        input[type="file"] {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .file-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .file-link, .delete-btn {
                margin-left: 0;
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 DriveHost</h1>
        <div class="subtitle">Upload files directly to my Google Drive</div>
        
        <div class="stats" id="stats" style="display: none;">
            <div class="stat-item">
                <div class="stat-value" id="fileCount">0</div>
                <div class="stat-label">Files</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalSize">0 MB</div>
                <div class="stat-label">Total Size</div>
            </div>
        </div>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <p>Click or drag files here</p>
            <small>Maximum file size: 100MB per file</small>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">Choose Files</button>
            <button class="btn btn-danger" onclick="refreshFiles()">🔄 Refresh</button>
        </div>
        
        <input type="file" id="fileInput" multiple onchange="uploadFiles(this.files)">
        
        <div id="status" class="status"></div>
        
        <div class="file-list">
            <h3>📄 Files in My Drive</h3>
            <div id="fileList">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading files...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        // CHANGE THIS TO YOUR LOCALTONET NODE-RED URL
        const NODE_RED_URL = 'https://your-app-name.localto.net';
        
        // Endpoints (adjust based on your Node-RED flow)
        const UPLOAD_ENDPOINT = `${NODE_RED_URL}/upload`;
        const LIST_ENDPOINT = `${NODE_RED_URL}/files`;
        const DELETE_ENDPOINT = `${NODE_RED_URL}/delete`;
        
        // ==================== FILE UPLOAD ====================
        async function uploadFiles(files) {
            if (!files || files.length === 0) return;
            
            showStatus(`Uploading ${files.length} file(s)...`, 'info');
            
            for (let file of files) {
                // Check file size (100MB limit)
                if (file.size > 100 * 1024 * 1024) {
                    showStatus(`❌ ${file.name} exceeds 100MB limit`, 'error');
                    continue;
                }
                
                const formData = new FormData();
                formData.append('file', file);
                formData.append('filename', file.name);
                
                try {
                    showStatus(`📤 Uploading ${file.name}...`, 'info');
                    
                    const response = await fetch(UPLOAD_ENDPOINT, {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        showStatus(`✅ ${file.name} uploaded successfully!`, 'success');
                    } else {
                        const error = await response.text();
                        throw new Error(error || 'Upload failed');
                    }
                } catch (error) {
                    console.error('Upload error:', error);
                    showStatus(`❌ Failed to upload ${file.name}: ${error.message}`, 'error');
                }
            }
            
            // Refresh file list after uploads
            setTimeout(() => refreshFiles(), 1000);
            
            // Clear file input
            document.getElementById('fileInput').value = '';
        }
        
        // ==================== LIST FILES ====================
        async function refreshFiles() {
            const fileListDiv = document.getElementById('fileList');
            fileListDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading files...</p></div>';
            
            try {
                const response = await fetch(LIST_ENDPOINT);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch files');
                }
                
                const files = await response.json();
                displayFiles(files);
                
            } catch (error) {
                console.error('List error:', error);
                fileListDiv.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #666;">
                        <p>❌ Failed to load files</p>
                        <small>${error.message}</small>
                        <br><br>
                        <button class="btn btn-primary" onclick="refreshFiles()">Try Again</button>
                    </div>
                `;
                showStatus('Error loading files from server', 'error');
            }
        }
        
        function displayFiles(files) {
            const fileListDiv = document.getElementById('fileList');
            
            if (!files || files.length === 0) {
                fileListDiv.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #666;">
                        <p>📭 No files yet</p>
                        <small>Upload your first file above!</small>
                    </div>
                `;
                document.getElementById('stats').style.display = 'none';
                return;
            }
            
            // Calculate stats
            let totalBytes = 0;
            files.forEach(file => {
                totalBytes += file.size || 0;
            });
            
            document.getElementById('fileCount').textContent = files.length;
            document.getElementById('totalSize').textContent = formatBytes(totalBytes);
            document.getElementById('stats').style.display = 'flex';
            
            // Display files
            fileListDiv.innerHTML = files.map(file => `
                <div class="file-item" data-file-id="${file.id}">
                    <div class="file-info">
                        <span class="file-name">${escapeHtml(file.name)}</span>
                        ${file.size ? `<span class="file-size">(${formatBytes(file.size)})</span>` : ''}
                        ${file.modifiedTime ? `<span class="file-date">📅 ${formatDate(file.modifiedTime)}</span>` : ''}
                    </div>
                    <div>
                        ${file.webViewLink ? `<a href="${file.webViewLink}" target="_blank" class="file-link">View</a>` : ''}
                        <button class="delete-btn" onclick="deleteFile('${file.id}', '${escapeHtml(file.name)}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        // ==================== DELETE FILE ====================
        async function deleteFile(fileId, fileName) {
            if (!confirm(`Delete "${fileName}" from Google Drive?`)) {
                return;
            }
            
            showStatus(`🗑️ Deleting ${fileName}...`, 'info');
            
            try {
                const response = await fetch(`${DELETE_ENDPOINT}/${fileId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showStatus(`✅ ${fileName} deleted successfully`, 'success');
                    refreshFiles();
                } else {
                    throw new Error('Delete failed');
                }
            } catch (error) {
                console.error('Delete error:', error);
                showStatus(`❌ Failed to delete ${fileName}`, 'error');
            }
        }
        
        // ==================== DRAG & DROP ====================
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragenter', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });
        
        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                uploadFiles(files);
            }
        });
        
        // ==================== UTILITIES ====================
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function formatDate(dateString) {
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString();
            } catch {
                return '';
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            
            setTimeout(() => {
                if (statusDiv.className === `status ${type}`) {
                    statusDiv.style.display = 'none';
                    setTimeout(() => {
                        statusDiv.className = 'status';
                    }, 100);
                }
            }, 4000);
        }
        
        // ==================== INITIAL LOAD ====================
        refreshFiles();
    </script>
</body>
</html>
