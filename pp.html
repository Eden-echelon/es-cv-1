<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">

    <title>Parables & Platters</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
 
    <link rel="icon" type="image/png" href="favicon.png" sizes="16x16">

    <link rel="icon" type="image/png" href="favicon.png" sizes="32x32">
    <link rel="icon" type="image/png" href="favicon.png" sizes="48x48">
    <link rel="icon" type="image/png" href="favicon.png" sizes="96x96">
    <link rel="icon" type="image/png" href="favicon.png" sizes="192x192">
    
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="apple-touch-icon-precomposed" href="favicon.png">
    
    <meta name="msapplication-TileImage" content="favicon.png">
    <meta name="msapplication-TileColor" content="#000000">    

    <style>

        * {
            
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            
        }

        body {
            
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #070503;
            background-image: radial-gradient(ellipse at 40% 30%, rgba(35, 28, 22, 0.8) 0%, #030201 100%);
            min-height: 100vh;
            color: #ede6dc;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
            line-height: 1.4;
            position: relative;
            
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #0c0907; }
        ::-webkit-scrollbar-thumb { background: #c28a4e; }
        ::-webkit-scrollbar-thumb:hover { background: #e0a76b; }

        .sacred-header {
            
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(7, 5, 3, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 16px 5%;
            z-index: 1100;
            border-bottom: 2px solid rgba(194, 138, 78, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        
        .header-logo-link {
            
            display: block;
            width: 100px;
            height: 100px;
            border-radius: 50%;       /* 🌀 CIRCLE logo */
            background: rgba(15, 12, 9, 0.75);
            border: 2.5px solid rgba(194, 138, 78, 0.95);
            box-shadow: 0 0 0 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(2px);
            
        }
        
        .header-logo-link img {
            
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease, filter 0.2s;
            filter: brightness(0.98) contrast(1.02);
            opacity: 0.92;
            border-radius: 50%;
            
        }
        
        .header-logo-link:hover {
            
            transform: scale(1.03);
            border-color: #f0ca94;
            box-shadow: 0 0 0 3px rgba(194,138,78,0.6);
            
        }
        
        .header-logo-link:hover img {
            
            transform: scale(1.02);
            filter: brightness(1.05);
            opacity: 1;
            
        }

        .floating-emblem {
            
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 70px;
            height: 70px;
            background: rgba(15, 12, 9, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(194, 138, 78, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1050;
            transition: all 0.25s ease;
            border-radius: 0px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
            
        }
        
        .floating-emblem img {
            
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 0px;
            opacity: 0.9;
            
        }
        
        .floating-emblem:hover {
            
            transform: scale(1.08);
            border-color: #f0ca94;
            
        }

        .menu-grid {
            
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 350px));
            justify-content: center;
            gap: 44px 38px;
            max-width: 1500px;
            width: 100%;
            margin: 180px auto 40px auto;
            padding: 0 28px;
            
        }

        .menu-card {
            
            background: rgba(18, 15, 12, 0.75);
            backdrop-filter: blur(5px);
            border: 1.5px solid rgba(194, 138, 78, 0.55);
            transition: all 0.35s cubic-bezier(0.2, 0.85, 0.4, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            
        }
        
        .menu-card:hover {
            
            transform: translateY(-5px);
            background: rgba(32, 26, 20, 0.88);
            border-color: rgba(210, 158, 92, 0.9);
            box-shadow: 0 20px 30px -10px rgba(0,0,0,0.6);
            
        }
        
        .card-img {
            
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.3s;
            filter: brightness(0.85) contrast(1.08);
            opacity: 0.92;
            border-bottom: 1px solid rgba(194,138,78,0.3);
            
        }
        
        .menu-card:hover .card-img {
            
            transform: scale(1.02);
            filter: brightness(0.92) contrast(1.1);
            opacity: 1;
            
        }
        
        .card-body {
            
            padding: 24px 20px 28px;
            text-align: center;
            background: rgba(10, 8, 6, 0.4);
            
        }
        
        .item-title {
            
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f5e8d4, #e0b87a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            
        }
        
        .item-price {
            
            font-size: 1.75rem;
            font-weight: 800;
            color: #e9c28e;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 5px 26px;
            margin: 10px 0 12px;
            border: 1px solid rgba(210, 158, 92, 0.8);
            
        }
        
        .item-desc {
            
            font-size: 0.88rem;
            color: #e2d4c2;
            line-height: 1.5;
            margin: 12px 0 20px;
            padding: 0 6px;
            
        }
        
        .order-cta {
            
            background: linear-gradient(105deg, rgba(139, 94, 52, 0.9), rgba(110, 74, 40, 0.95));
            border: none;
            padding: 12px 10px;
            width: 88%;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            color: #fff7ef;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s;
            clip-path: polygon(0% 0%, 100% 0%, 96% 100%, 4% 100%);
            
        }
        
        .order-cta:hover {
            
            background: linear-gradient(105deg, #a57241, #8b5e34);
            transform: scale(0.97);
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
            
        }

        .sacred-footer {
            
            width: 100%;
            background: rgba(5, 3, 2, 0.92);
            backdrop-filter: blur(12px);
            border-top: 2px solid rgba(194, 138, 78, 0.7);
            padding: 20px 24px;
            margin-top: auto;
            font-size: 0.8rem;
            color: #cfbea5;
            position: relative;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            
        }
        
        .footer-sigil {
            
            font-size: 0.75rem;
            letter-spacing: 5px;
            opacity: 0.8;
            font-weight: 500;
            
        }
        .notepad-widget {
            
            background: rgba(25, 20, 15, 0.85);
            backdrop-filter: blur(8px);
            border-left: 3px solid #c28a4e;
            padding: 10px 14px;
            border-radius: 0px;
            width: 260px;
            max-width: 100%;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            
        }
        .notepad-header {
            
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.7rem;
            color: #e9cfaa;
            margin-bottom: 8px;
            letter-spacing: 1px;
            
        }
        
        .notepad-textarea {
            
            width: 100%;
            background: #1e1915;
            border: 1px solid #5e4a36;
            color: #f2e6da;
            font-size: 0.75rem;
            padding: 8px 10px;
            resize: vertical;
            font-family: 'Inter', monospace;
            transition: 0.1s;
            border-radius: 0px;
            
        }
        
        .notepad-textarea:focus {
            
            outline: none;
            border-color: #c28a4e;
            background: #2c241e;
            
        }
        
        .notepad-stats {
            
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            font-size: 0.6rem;
            margin-top: 6px;
            color: #ab946f;
            
        }
        
        .notepad-actions {
            
            display: flex;
            gap: 8px;
            margin-top: 6px;
            
        }
        
        .notepad-btn {
            
            background: none;
            border: 1px solid #6e533b;
            color: #e2bc89;
            font-size: 0.6rem;
            padding: 4px 8px;
            cursor: pointer;
            transition: 0.15s;
            font-weight: 600;
            
        }
        
        .notepad-btn:hover {
            
            background: #c28a4e;
            color: #0f0b07;
            border-color: #c28a4e;
            
        }
        
        @media (max-width: 720px) {
            
            .sacred-footer { flex-direction: column; text-align: center; align-items: stretch; }
            .notepad-widget { width: 100%; }
            
        }

        .side-controls {
            
            position: fixed;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 1080;
            background: rgba(8, 6, 4, 0.6);
            backdrop-filter: blur(12px);
            padding: 16px 12px;
            border: 1.5px solid rgba(194, 138, 78, 0.7);
            border-radius: 0px;
            
        }
        
        .nav-btn {
            
            width: 48px;
            height: 48px;
            background: rgba(30, 24, 20, 0.8);
            border: 1.5px solid #c28a4e;
            color: #e0bd8f;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.3rem;
            position: relative;
            
        }
        
        .nav-btn::after {
            
            content: attr(data-tooltip);
            position: absolute;
            right: 62px;
            background: rgba(25, 20, 16, 0.9);
            backdrop-filter: blur(8px);
            color: #f3e5d2;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 5px 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
            border: 1px solid #c28a4e;
            pointer-events: none;
            
        }
        
        .nav-btn:hover::after { opacity: 1; }
        .nav-btn:hover {
            
            background: #c28a4e;
            color: #0d0a07;
            transform: scale(1.05);
            
        }
        
        @media (max-width: 680px) {
            
            .side-controls { right: 12px; gap: 12px; padding: 12px 8px; }
            .nav-btn { width: 42px; height: 42px; }
            .nav-btn::after { display: none; }
            
        }

        .modal-overlay {
            
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(18px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 16px;
            
        }
        
        .modal-container {
            
            background: rgba(24, 19, 15, 0.96);
            backdrop-filter: blur(4px);
            max-width: 620px;
            width: 100%;
            padding: 32px 34px;
            position: relative;
            animation: modalRise 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 2px solid #c28a4e;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 40px rgba(0,0,0,0.7);
            
        }
        
        @keyframes modalRise {
            0% { opacity: 0; transform: scale(0.96) translateY(12px);}
            100% { opacity: 1; transform: scale(1) translateY(0);}
        }
        
        .modal-close {
            
            position: absolute;
            top: 20px;
            right: 24px;
            background: #2d241e;
            width: 38px;
            height: 38px;
            border: 1px solid #c28a4e;
            font-size: 18px;
            cursor: pointer;
            color: #e2bc89;
            transition: 0.2s;
            
        }
        
        .modal-close:hover {
            
            background: #c28a4e;
            color: #0f0b07;
            transform: rotate(90deg);
            
        }
        
        .modal-title {
            
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            margin-bottom: 26px;
            border-left: 4px solid #c28a4e;
            padding-left: 20px;
            color: #f5e9db;
            
        }
        
        .form-row { margin-bottom: 20px; }
        .form-row label {
            
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: #e2cfb5;
            
        }
        
        .form-row input, .form-row select, .form-row textarea {
            
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #4e3c2e;
            background: rgba(33, 28, 23, 0.9);
            color: #f2e5d8;
            font-size: 0.9rem;
            transition: 0.2s;
            
        }
        
        .form-row input:focus, .form-row select:focus {
            
            border-color: #dcae77;
            outline: none;
            box-shadow: 0 0 0 2px rgba(194, 138, 78, 0.5);
            background: #2f2720;
            
        }
        
        .input-error { border-color: #dd7a5a !important; background: rgba(46, 31, 26, 0.95) !important; }
        .error-txt {
            
            color: #e68a6b;
            font-size: 0.7rem;
            display: none;
            margin-top: 5px;
            margin-left: 12px;
            
        }
        
        .modal-buttons { display: flex; gap: 15px; margin-top: 28px; }
        .btn-primary {
            
            background: rgba(139, 94, 52, 0.95);
            flex: 1;
            padding: 12px;
            border: none;
            font-weight: 700;
            color: #fef2e4;
            cursor: pointer;
            transition: 0.2s;
            clip-path: polygon(0% 0%, 100% 0%, 96% 100%, 4% 100%);
            
        }
        
        .btn-primary:hover { background: #b07844; transform: scale(0.98); }
        .btn-secondary {
            
            background: rgba(51, 42, 35, 0.9);
            flex: 1;
            padding: 12px;
            border: 1px solid #8b5e34;
            cursor: pointer;
            color: #dfcdb7;
            
        }
        
        .cash-note {
            
            background: rgba(43, 35, 30, 0.7);
            padding: 12px;
            text-align: center;
            font-size: 0.75rem;
            margin: 16px 0 6px;
            border-left: 3px solid #c28a4e;
            
        }
        
        .toast-msg {
            
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(16, 13, 10, 0.9);
            backdrop-filter: blur(20px);
            color: #f3e8dc;
            padding: 12px 24px;
            font-weight: 600;
            z-index: 2200;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
            border-top: 2px solid #dcae77;
            border-bottom: 2px solid #dcae77;
            font-size: 0.85rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
            
        }
        
        .toast-msg.show { opacity: 1; transform: translateX(-50%) scale(1); pointer-events: auto; }
        .copy-order-btn {
            
            background: #c28a4e;
            border: none;
            padding: 4px 12px;
            margin-left: 12px;
            font-weight: bold;
            cursor: pointer;
            color: #1e1712;
            
        }
        
        .loading-spinner {
            
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,235,200,0.3);
            border-top-color: #e2bc7a;
            animation: spin 0.8s linear infinite;
            
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .guidance-badge {
            
            position: fixed;
            bottom: 100px;
            left: 24px;
            background: rgba(31, 25, 20, 0.75);
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-left: 3px solid #c28a4e;
            color: #ebdbbc;
            z-index: 1040;
            pointer-events: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            
        }
        
        @media (max-width: 560px) { .guidance-badge { display: none; } }
        @media (max-width: 520px) {
            .menu-grid { gap: 28px; margin-top: 160px; padding: 0 16px; }
            .modal-container { padding: 22px 18px; }
            .item-title { font-size: 1.7rem; }
            .header-logo-link { width: 80px; height: 80px; }
        }

    </style>

</head>

<body>

<header class="sacred-header">
    <a href="#" class="header-logo-link" id="homeLogoLink">
        <img src="images/jesuslogo_enef_clean.png" alt="Parables & Platters" onerror="this.src='https://placehold.co/200x200/2c241e/e2bc8a?text=✝️'; this.onerror=null;">
    </a>
</header>

<div class="side-controls">
    <div class="nav-btn" id="scrollTopBtn" data-tooltip="SUMMIT"><i class="fas fa-chevron-up"></i></div>
    <div class="nav-btn" id="scrollMiddleBtn" data-tooltip="CENTER"><i class="fas fa-square"></i></div>
    <div class="nav-btn" id="scrollDownBtn" data-tooltip="DEPTH"><i class="fas fa-chevron-down"></i></div>
    <div class="nav-btn" id="quickScrollAdvance" data-tooltip="ADVANCE +400"><i class="fas fa-forward-step"></i></div>
</div>

<div class="guidance-badge"><i class="fas fa-cube"></i> sacred menu</div>

<div class="menu-grid" id="dynamicMenuGrid"></div>

<div id="orderModal" class="modal-overlay">
    <div class="modal-container">
        <button class="modal-close" id="modalCloseBtn"><i class="fas fa-times"></i></button>
        <div class="modal-title"><i class="fas fa-feather-alt"></i> Sacred Offering</div>
        <form id="orderFormCore" novalidate>
            <input type="hidden" id="selectedItemName">
            <input type="hidden" id="selectedItemPrice">
            <input type="hidden" id="selectedItemExtras">
            <div class="form-row"><label><i class="fas fa-user"></i> Full name *</label><input type="text" id="fullName" autocomplete="name"><div class="error-txt" id="nameError">Name required</div></div>
            <div class="form-row"><label><i class="fas fa-phone-alt"></i> WhatsApp / Phone *</label><input type="tel" id="phoneNumber" autocomplete="tel"><div class="error-txt" id="phoneError">9-15 digits</div></div>
            <div class="form-row"><label><i class="fas fa-envelope"></i> Email *</label><input type="email" id="emailAddress" autocomplete="email"><div class="error-txt" id="emailError">Valid email required</div></div>
            <div class="form-row"><label><i class="fas fa-location-dot"></i> Pickup zone *</label><select id="pickupZone"><option value="">— Choose zone —</option><option value="Durban CBD - The Market">🏛️ The Market, Durban CBD</option><option value="Durban CBD - Harbour Side">⚓ Harbour Side, Durban CBD</option><option value="Durban CBD - Workshop Side">🔧 Workshop Side, Durban CBD</option></select><div class="error-txt" id="zoneError">Select zone</div></div>
            <div class="form-row"><label><i class="fas fa-box"></i> Quantity (plates) *</label><input type="number" id="quantityOrder" min="1" value="1"><div class="error-txt" id="qtyError">Minimum 1 plate</div></div>
            <div class="form-row"><label><i class="fas fa-message"></i> Special notes</label><textarea id="specialNotes" rows="2"></textarea></div>
            <div class="cash-note"><i class="fas fa-coins"></i> <strong>Cash only</strong> — pay upon pickup. We'll confirm order.</div>
            <div class="modal-buttons"><button type="submit" class="btn-primary" id="submitOrderBtn"><i class="fas fa-check"></i> Place order</button><button type="button" class="btn-secondary" id="cancelModalBtn">Cancel</button></div>
        </form>
    </div>
</div>

<div id="globalToast" class="toast-msg"><i class="fas fa-dove"></i> <span id="toastText"></span></div>
<div class="floating-emblem" id="sacredEmblem"><img src="images/jesuslogo.png" onerror="this.src='https://placehold.co/70x70/2c241e/e2bc8a?text=✝️'"></div>

<footer class="sacred-footer">
    <div class="footer-sigil">✝️ PARABLES & PLATTERS — FEEDING THE SOUL ✝️</div>
    <div class="notepad-widget" id="sacredNotepad">
        <div class="notepad-header"><i class="fas fa-pen-fancy"></i> <span>✦ Sacred Notes ✦</span><i class="fas fa-save" style="margin-left:auto; font-size:0.65rem;"></i></div>
        <textarea id="notepadContent" class="notepad-textarea" rows="2" placeholder="Write down reflections, prayer requests, or menu reminders... (auto-saved locally)"></textarea>
        <div class="notepad-stats"><span id="noteCharCount">0</span> chars · <span id="noteWordCount">0</span> words</div>
        <div class="notepad-actions"><button type="button" id="clearNotepadBtn" class="notepad-btn"><i class="fas fa-trash-alt"></i> Clear</button><button type="button" id="saveNotepadBtn" class="notepad-btn"><i class="fas fa-download"></i> Save now</button></div>
    </div>
</footer>

<script>

    (function() {

        const MENU_DB = [
            { id: 1, name: "Pap, Steak & Wors", price: "R60", desc: "Pap, steak, wors, sambal, chilli, creamy coleslaw & sauce", img: "images/psw.jpg", extra: "pap, steak, wors, sambal, coleslaw & sauce" },
        ];
        let currentSelectedItem = null;
        const menuContainer = document.getElementById('dynamicMenuGrid');
        const modalOverlay = document.getElementById('orderModal');
        const toastDiv = document.getElementById('globalToast');
        const toastTextSpan = document.getElementById('toastText');

        function showToast(message, isSuccess = true, copyOrderNumber = null) {
            toastTextSpan.innerHTML = message;
            toastDiv.classList.add('show');
            let copyBtn = toastDiv.querySelector('.copy-order-btn');
            if(copyOrderNumber && !copyBtn) {
                const btn = document.createElement('button');
                btn.className = 'copy-order-btn';
                btn.innerHTML = '📋 Copy #';
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navigator.clipboard.writeText(copyOrderNumber).then(() => showToast(`✨ Order ${copyOrderNumber} copied!`, true));
                });
                toastTextSpan.appendChild(btn);
            } else if(!copyOrderNumber && copyBtn) copyBtn.remove();
            setTimeout(() => toastDiv.classList.remove('show'), 5000);
        }

        function generateOrderRef() {
            const now = new Date();
            return `PP-${now.getFullYear().toString().slice(-2)}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${Math.floor(1000+Math.random()*9000)}`;
        }
        function clearFormErrors() { ['fullName','phoneNumber','emailAddress','pickupZone','quantityOrder'].forEach(id=>{ document.getElementById(id)?.classList.remove('input-error'); }); ['nameError','phoneError','emailError','zoneError','qtyError'].forEach(e=>{ document.getElementById(e).style.display='none'; }); }
        function showFieldError(inputId, errorId) { document.getElementById(inputId).classList.add('input-error'); document.getElementById(errorId).style.display = 'block'; }
        function hideFieldError(inputId, errorId) { document.getElementById(inputId).classList.remove('input-error'); document.getElementById(errorId).style.display = 'none'; }
        function validateOrderForm() {
            let isValid = true;
            const name = document.getElementById('fullName').value.trim();
            if(!name || name.length<2) { showFieldError('fullName','nameError'); isValid=false; } else hideFieldError('fullName','nameError');
            const phone = document.getElementById('phoneNumber').value.trim();
            if(!phone || !/^[0-9]{9,15}$/.test(phone)) { showFieldError('phoneNumber','phoneError'); isValid=false; } else hideFieldError('phoneNumber','phoneError');
            const email = document.getElementById('emailAddress').value.trim();
            if(!email || !/^[^\s@]+@([^\s@]+\.)+[^\s@]+$/.test(email)) { showFieldError('emailAddress','emailError'); isValid=false; } else hideFieldError('emailAddress','emailError');
            if(!document.getElementById('pickupZone').value) { showFieldError('pickupZone','zoneError'); isValid=false; } else hideFieldError('pickupZone','zoneError');
            const qty = parseInt(document.getElementById('quantityOrder').value,10);
            if(isNaN(qty) || qty<1) { showFieldError('quantityOrder','qtyError'); isValid=false; } else hideFieldError('quantityOrder','qtyError');
            return isValid;
        }
        function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
        function renderMenu() {
            menuContainer.innerHTML = '';
            MENU_DB.forEach(item => {
                const card = document.createElement('div'); card.className = 'menu-card';
                card.innerHTML = `<img class="card-img" src="${item.img}" alt="${item.name}" loading="lazy" onerror="this.src='https://placehold.co/600x600/2a211b/e2bc8a?text=Meal'"><div class="card-body"><h2 class="item-title">${escapeHtml(item.name)}</h2><div class="item-price">${item.price}</div><p class="item-desc">${escapeHtml(item.desc)}</p><button class="order-cta" data-id="${item.id}"><i class="fas fa-shopping-cart"></i> Order now <i class="fas fa-arrow-right"></i></button></div>`;
                card.querySelector('.order-cta').addEventListener('click', (e) => { e.preventDefault(); currentSelectedItem = item; openOrderModal(item); });
                menuContainer.appendChild(card);
            });
        }
        function openOrderModal(item) {
            document.getElementById('selectedItemName').value = item.name;
            document.getElementById('selectedItemPrice').value = item.price;
            document.getElementById('selectedItemExtras').value = item.extra;
            document.getElementById('fullName').value = ''; document.getElementById('phoneNumber').value = ''; document.getElementById('emailAddress').value = ''; document.getElementById('pickupZone').value = ''; document.getElementById('quantityOrder').value = '1'; document.getElementById('specialNotes').value = '';
            clearFormErrors(); modalOverlay.style.display = 'flex';
        }
        function closeModal() { modalOverlay.style.display = 'none'; currentSelectedItem = null; }

        // form submission
        const orderForm = document.getElementById('orderFormCore');
        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentSelectedItem) { showToast("Select a meal first", false); return; }
            if(!validateOrderForm()) { showToast("Please fix highlighted errors", false); return; }
            const submitBtn = document.getElementById('submitOrderBtn');
            const originalHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="loading-spinner"></span> Offering...'; submitBtn.disabled = true;
            const orderNumber = generateOrderRef();
            const fd = new FormData();
            fd.append('item', currentSelectedItem.name); fd.append('price', currentSelectedItem.price); fd.append('extraDetails', currentSelectedItem.extra);
            fd.append('name', document.getElementById('fullName').value.trim()); fd.append('phone', document.getElementById('phoneNumber').value.trim());
            fd.append('email', document.getElementById('emailAddress').value.trim()); fd.append('company', document.getElementById('pickupZone').value);
            fd.append('quantity', document.getElementById('quantityOrder').value); fd.append('special_request', document.getElementById('specialNotes').value);
            fd.append('orderNumber', orderNumber); fd.append('_subject', `🍽️ ORDER: ${currentSelectedItem.name} | ${orderNumber}`);
            try {
                const res = await fetch('https://formspree.io/f/manqrkpv', { method: 'POST', body: fd, headers: { 'Accept': 'application/json' } });
                if(res.ok) { closeModal(); showToast(`✅ Order #${orderNumber} confirmed! ${currentSelectedItem.name}`, true, orderNumber); orderForm.reset(); clearFormErrors(); }
                else throw new Error('submit failed');
            } catch(err) { closeModal(); showToast(`❌ Order failed. Please try again.`, false); }
            finally { submitBtn.innerHTML = originalHtml; submitBtn.disabled = false; }
        });

        document.getElementById('phoneNumber')?.addEventListener('input', function(e) { this.value = this.value.replace(/[^0-9]/g, '').slice(0,15); });
        document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
        document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });

        // scrolling
        document.getElementById('scrollTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        document.getElementById('scrollDownBtn').addEventListener('click', () => window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' }));
        document.getElementById('scrollMiddleBtn').addEventListener('click', () => { const h = document.documentElement.scrollHeight - window.innerHeight; window.scrollTo({ top: Math.max(0, h/2), behavior: 'smooth' }); showToast(`⬚ CENTER alignment`, true); });
        document.getElementById('quickScrollAdvance').addEventListener('click', () => { window.scrollBy({ top: 450, behavior: 'smooth' }); showToast(`Advance +450`, true); });
        document.getElementById('sacredEmblem').addEventListener('click', () => showToast(`"Taste and see that the Lord is good" — Psalm 34:8 🕊️`, true));
        document.getElementById('homeLogoLink').addEventListener('click', (e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
        
        const noteTextarea = document.getElementById('notepadContent');
        const charSpan = document.getElementById('noteCharCount');
        const wordSpan = document.getElementById('noteWordCount');
        const clearBtn = document.getElementById('clearNotepadBtn');
        const saveManualBtn = document.getElementById('saveNotepadBtn');
        const STORAGE_KEY = 'parables_notepad_soul';

        function updateStats() {
            const txt = noteTextarea.value;
            charSpan.innerText = txt.length;
            const words = txt.trim() === '' ? 0 : txt.trim().split(/\s+/).length;
            wordSpan.innerText = words;
        }
        function saveToLocalStorage() {
            const content = noteTextarea.value;
            localStorage.setItem(STORAGE_KEY, content);
            showToast(`✍️ Notes saved locally`, true);
            updateStats();
        }
        function loadFromLocalStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if(saved !== null) noteTextarea.value = saved;
            updateStats();
        }
        function clearNotepad() {
            if(confirm('Clear sacred notes? (cannot undo local)')) {
                noteTextarea.value = '';
                localStorage.removeItem(STORAGE_KEY);
                updateStats();
                showToast(`Notepad cleared`, true);
            }
        }
        
        let debounceTimer;
        noteTextarea.addEventListener('input', () => {
            updateStats();
            if(debounceTimer) clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                localStorage.setItem(STORAGE_KEY, noteTextarea.value);

            }, 600);
        });
        saveManualBtn.addEventListener('click', () => saveToLocalStorage());
        clearBtn.addEventListener('click', () => clearNotepad());
        window.addEventListener('DOMContentLoaded', () => loadFromLocalStorage());
        noteTextarea.addEventListener('blur', () => { localStorage.setItem(STORAGE_KEY, noteTextarea.value); updateStats(); });
        
        setTimeout(() => { const b = document.getElementById('guidanceHint'); if(b) b.style.opacity = '0'; setTimeout(() => { if(b) b.style.display = 'none'; }, 800); }, 7000);
        renderMenu();
    })();

</script>

</body>

</html>
